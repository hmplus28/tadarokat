{% load custom_filters %}
{# پنل عملیات مدیر: ارجاع کارشناس / بازگشت استعلام — purchase_ids: لیست pk (تک یا چند) #}
<div class="bg-amber-50 border border-amber-200 rounded-xl p-5 space-y-4">
    <div>
        <h4 class="font-bold text-amber-950 flex items-center gap-2">⚙️ اقدام مدیر تدارکات</h4>
        <p class="text-xs text-amber-800 mt-1 leading-relaxed">
            می‌توانید ردیف را به کارشناس دیگر ارجاع دهید یا برای استعلام مجدد به کارشناس برگردانید.
        </p>
    </div>

    <form method="post" action="{% url 'orders:review_action' %}" class="space-y-4" id="review-action-form">
        {% csrf_token %}
        {% for pid in purchase_ids %}
        <input type="hidden" name="purchase_ids" value="{{ pid }}">
        {% endfor %}
        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="form-label text-amber-900">کارشناس مقصد (اختیاری برای بازگشت)</label>
                <select name="expert_name" class="form-input bg-white">
                    <option value="">— بدون تغییر / همان کارشناس —</option>
                    {% for ex in expert_choices %}
                    <option value="{{ ex.value }}" {% if ex.value == current_expert %}selected{% endif %}>
                        {{ ex.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label text-amber-900">توضیح / دلیل</label>
                <input type="text" name="note" class="form-input bg-white"
                       placeholder="مثال: قیمت نامناسب — استعلام از تأمین‌کننده دیگر">
            </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-2 border-t border-amber-200/80">
            <button type="submit" name="action" value="reassign"
                    class="btn btn-ghost !py-2.5 !px-4 border border-indigo-200 !text-indigo-800 hover:!bg-indigo-50">
                👤 ارجاع به کارشناس دیگر
            </button>
            <button type="submit" name="action" value="return_inquiry"
                    class="btn btn-ghost !py-2.5 !px-4 border border-rose-200 !text-rose-800 hover:!bg-rose-50"
                    onclick="return confirm('این ردیف برای استعلام مجدد برمی‌گردد. ادامه می‌دهید؟');">
                🔄 بازگشت برای استعلام مجدد
            </button>
        </div>
    </form>
</div>
